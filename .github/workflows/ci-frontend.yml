name: Frontend CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # CRA build will fail on many lint errors only if CI=true.
      # Keeping CI=false avoids breaking builds on warnings.
      - name: Build
        run: npm run build
        env:
          CI: 'false'

      # Optional tests (enable when stable)
      # - name: Test
      #   run: npm test -- --watchAll=false
      #   env:
      #     CI: 'true'
